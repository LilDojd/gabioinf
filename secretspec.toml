[project]
name = "gabioinf"
revision = "1.0"

[providers]
local = "keyring://"

[profiles.default]
DATABASE_URL = { description = "PostgreSQL connection string", required = true }
GABIOINF_SECRET = { description = "GitHub OAuth client secret", required = true }
SESSION_SECRET = { description = "Session cookie signing key", required = true, type = "base64", generate = { bytes = 64 } }
SENTRY_DSN = { description = "Sentry error reporting endpoint", required = false }

[profiles.default.defaults]
providers = ["local"]
