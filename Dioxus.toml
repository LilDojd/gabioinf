[application]

# App (Project) Name
name = "gabioinf"
default_platform = "web"
tailwind_input = "input.css"
tailwind_output = "assets/tailwind.css"

# [web.wasm_opt]
# # The level wasm-opt should target. z is the smallest. 4 is the fastest.
# level = "0"

[web.app]

# HTML title tag content
title = "George Andreev"

[web.watcher]

# when watcher trigger, regenerate the `index.html`
reload_html = true

# which files or dirs will be watcher monitoring
watch_path = ["src", "assets", "content"]

[web.resource.dev]

script = []
