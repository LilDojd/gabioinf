[package]
name = "gabioinf"
version = "0.1.0"
edition = "2024"
authors = ["LilDojd <yawner@protonmail.com>"]
publish = false

[package.metadata.cargo-machete]
ignored = ["getrandom"]

[dependencies]
anyhow = { version = "1.0.104" }

reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
], optional = true }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
], optional = true }
time = { version = "0.3.55", features = [
  "macros",
  "formatting",
  "serde",
  "local-offset",
] }
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
config = { version = "0.15.25", default-features = false, features = [
  "convert-case",
  "toml",
], optional = true }
derive_more = { version = "2.1.1", features = ["from", "into"] }
thiserror = { version = "2.0.20", optional = true }
base64 = { version = "0.22.1", optional = true }

axum = { version = "0.8.9", default-features = false, features = [
  "form",
  "http1",
  "query",
  "tokio",
], optional = true }
validator = { version = "0.21.0", features = ["derive"], optional = true }
tokio = { version = "1.53.1", features = [
  "net",
  "rt-multi-thread",
  "signal",
  "time",
], optional = true }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "cookie-private",
], optional = true }
sqlx = { version = "0.8.6", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "tls-rustls",
], optional = true }
tower = { version = "0.5.3", optional = true, features = ["timeout", "util"] }
tower-http = { version = "0.7.1", features = ["cors"], optional = true }
oauth2 = { version = "5.0.0", optional = true }
rustrict = { version = "0.7.39", optional = true }
governor = { version = "0.10.4", optional = true }
tower_governor = { version = "0.8.0", default-features = false, features = [
  "axum",
  "tracing",
], optional = true }
forwarded-header-value = { version = "0.1.1", optional = true }
tower-sessions = { version = "0.14.0", default-features = false, features = [
  "axum-core",
  "signed",
], optional = true }
tower-sessions-sqlx-store = { version = "0.15.0", features = [
  "postgres",
], optional = true }
axum-login = { version = "0.18.0", optional = true }
axum-helmet = { version = "1.0.2", optional = true }

# Dioxus
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
dioxus-logger = { version = "0.7.10" }

# Web

getrandom = { version = "0.4.3" }
wasmtimer = { version = "0.4.3", default-features = false, features = ["tokio"] }
rand = { version = "0.10.2" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
web-sys = { version = "0.3.104", features = [
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "Path2d",
  "DomRect",
  "Document",
  "Window",
] }

sentry = { version = "0.49.2", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "reqwest",
  "rustls",
  "tower-axum-matched-path",
  "tracing",
], optional = true }

[build-dependencies]
arborium = { version = "2.18.2", default-features = false, features = ["lang-rust"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.55", features = ["macros", "parsing"] }
yaml_serde = "0.10.7"

[features]

server = [
  "dep:axum",
  "dep:base64",
  "dep:governor",
  "dep:tokio",
  "dep:axum-extra",
  "dep:sqlx",
  "dep:reqwest",
  "dep:tower",
  "dep:tower-http",
  "dep:oauth2",
  "dep:rustrict",
  "dep:validator",
  "dep:tower_governor",
  "dep:forwarded-header-value",
  "dep:tower-sessions",
  "dep:tower-sessions-sqlx-store",
  "dep:axum-login",
  "dep:axum-helmet",
  "dep:config",
  "dep:thiserror",
  "dep:sentry",
  "dep:tracing-subscriber",
  "dioxus/server",
]
web = ["dioxus/web", "time/wasm-bindgen", "getrandom/wasm_js"]

[dev-dependencies]
sentry = { version = "0.49.2", default-features = false, features = ["test"] }
serde_json = "1.0.151"
tower-sessions = { version = "0.14.0", default-features = false, features = ["memory-store"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
codegen-units = 1
debug = false
opt-level = 3
strip = "symbols"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
